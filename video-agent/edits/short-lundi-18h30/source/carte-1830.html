<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:900px;height:900px;overflow:hidden;background:#1E2A44}
  #card{position:absolute;inset:0;border-radius:56px;overflow:hidden;background:#24324F;border:3px solid #3A4A6B;box-sizing:border-box}
  #card>svg{position:absolute;inset:0}
  .pill{position:absolute;font-family:"Carlito";font-weight:700;border-radius:40px;padding:14px 30px;font-size:40px;white-space:nowrap}
  #dur{left:36px;top:34px;background:#F4EFE6;color:#1E2A44;display:flex;gap:16px}
  #dur b{color:#C9622A}
  #ok{right:36px;top:34px;background:#3CC79A;color:#07211A}
  #neuf{left:50%;bottom:36px;transform:translateX(-50%);background:#4AA6D8;color:#071C2A}
  #home{left:50%;bottom:36px;transform:translateX(-50%);background:#F08A4B;color:#2A1408}
  .tag{position:absolute;font-family:"Carlito";font-weight:700;font-size:32px;background:#F4EFE6;color:#1E2A44;border-radius:24px;padding:8px 18px;white-space:nowrap}
</style></head>
<body><div id="card">
<svg width="900" height="900" viewBox="0 0 900 900">
  <path d="M0 160 C220 210 330 120 480 170 S760 230 900 180 L900 0 L0 0Z" fill="#2B3B5C"/>
  <rect x="560" y="560" width="170" height="130" rx="22" fill="#28443F"/>
  <g id="streets" stroke="#33436A" stroke-width="12" stroke-linecap="round" fill="none"></g>
  <g stroke="#3D4E75" stroke-width="20" stroke-linecap="round" fill="none">
    <path d="M60 470 L840 470"/><path d="M450 220 L450 790"/>
  </g>
  <path id="glow" fill="none" stroke="#3CC79A" stroke-width="44" stroke-linejoin="round" stroke-linecap="round" opacity="0"/>
  <path id="loop" fill="none" stroke="#3CC79A" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
  <circle id="runner" r="18" fill="#FFFFFF" stroke="#3CC79A" stroke-width="7" cx="-50" cy="-50"/>
  <g id="door"><circle cx="340" cy="700" r="34" fill="#F08A4B"/><circle cx="340" cy="700" r="14" fill="#24324F"/></g>
</svg>
<div class="tag" id="tdoor" style="left:200px;top:740px">ma porte</div>
<div class="pill" id="dur"><span>Durée</span><b id="min">0 min</b></div>
<div class="pill" id="ok">Tracée ✓</div>
<div class="pill" id="neuf">Rues jamais courues</div>
<div class="pill" id="home">Retour au départ</div>
</div>
<script>
const S=(x,w)=>x<=0?0:1-(1+w*x)*Math.exp(-w*x);
const xs=[100,180,260,340,420,500,580,660,740,810], ys=[230,300,380,550,620,700,770];
let d='';
xs.forEach(x=>d+=`M${x} 220 L${x} 790 `); ys.forEach(y=>d+=`M60 ${y} L840 ${y} `);
const sp=document.createElementNS('http://www.w3.org/2000/svg','path'); sp.setAttribute('d',d);
document.getElementById('streets').appendChild(sp);
const NEW='M340 700 L260 700 L180 620 L180 550 L100 470 L180 380 L260 300 L340 230 L500 230 L580 300 L660 300 L740 380 L810 470 L740 550 L740 620 L660 700 L580 770 L500 770 L420 700 L340 700';
const loop=document.getElementById('loop'), glow=document.getElementById('glow');
loop.setAttribute('d',NEW); glow.setAttribute('d',NEW);
const L=loop.getTotalLength();
loop.style.strokeDasharray=L; glow.style.strokeDasharray=L;
const show=(id,a,dy,base)=>{const e=document.getElementById(id);e.style.opacity=a;e.style.transform=(base||'')+` translateY(${(1-a)*dy}px)`;};
window.setT=function(t){
  document.getElementById('card').style.opacity=S(t,10);
  // 0 → 1 : durée 30 min
  const da=S(t-0.05,8); show('dur',da,-24);
  document.getElementById('min').textContent=Math.round(30*Math.min(1,Math.max(0,(t-0.2)/0.7)))+' min';
  show('tdoor',S(t-0.3,8)*(1-S(t-3.2,6)),12);
  // 0.9 → 3.4 : la boucle sort
  const k=Math.min(1,S(t-0.9,1.6)*1.02); loop.style.strokeDashoffset=L*(1-k); glow.style.strokeDashoffset=L*(1-k);
  const c=S(t-3.0,7); glow.setAttribute('opacity',0.25*c); show('ok',c,-24);
  // 4 → : rues jamais courues, coureur sur la boucle
  const n=S(t-4.0,8)*(1-S(t-5.1,10)); show('neuf',n,24,'translateX(-50%)');
  const r=document.getElementById('runner');
  if(t>4.0){const f=Math.min(1,(t-4.0)/2.6);const p=loop.getPointAtLength(L*f);r.setAttribute('cx',p.x);r.setAttribute('cy',p.y);} else {r.setAttribute('cx',-50);r.setAttribute('cy',-50);}
  const h=S(t-6.0,8); show('home',h,24,'translateX(-50%)');
};
window.setT(0);
</script></body></html>
